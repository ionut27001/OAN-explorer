<div id="out"></div>

               "EA6A","E93E","F158","E9D9","E961","E99A","EC59","F0B9","E7F1","E9CE"];

  `<div class="g"><span class="s">&#x${c};</span><span class="c">${c}</span></div>`).join("");
</script></body></html>
